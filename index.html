<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Categories of documentation</title>

      
<style>

body
{
    font-family: Arial, Helvetica, sans-serif;
    margin: 20px auto;
    max-width: 900px;
    padding: 0 15px;
}
h1
{
    text-align:center;
}

button
{
    padding:12px;
    font-size:16px;
    margin-bottom:20px;
}


#categoryButtons
{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-bottom:25px;
}

.category
{
    width:100%;
}

@media (max-width:700px)
{
    #categoryButtons
    {
        grid-template-columns:repeat(2, 1fr);
    }
}


#pdfButtonContainer
{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}
.pdfSelected
{
    background:#90caf9;
    font-weight:bold;
}
#categoryHeader
{
    background:#f2f2f2;
    border:1px solid #c0c0c0;
    padding:12px;
    margin-bottom:20px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
}
#categoryHeader2
{
    background:#f2f2f2;
    border:1px solid #c0c0c0;
    padding:12px;
    margin-bottom:20px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
}

   ========================================= */

{
    filter:brightness(75%);
    font-weight:bold;
    box-shadow:0 0 0 3px #333333;
}
#documentHeader
{
    background:#f2f2f2;
    border:1px solid #c0c0c0;
