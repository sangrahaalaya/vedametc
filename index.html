<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Categories of documentation</title>

<script src="docs.js" defer></script>

<style>

body
{
    font-family: Arial, Helvetica, sans-serif;
    margin: 20px auto;
    max-width: 900px;
    padding: 0 15px;
}
h1
{
    text-align:center;
}

button
{
    padding:12px;
    font-size:16px;
    margin-bottom:20px;
}


#categoryButtons
{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-bottom:25px;
}

.category
{
    width:180px;
}



#pdfButtonContainer
{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}
.pdfSelected
{
    background:#90caf9;
    font-weight:bold;
}
#categoryHeader
{
    background:#f2f2f2;
    border:1px solid #c0c0c0;
    padding:12px;
    margin-bottom:20px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
}

.categoryA
{
    background:#E3F2FD;
    color:#0D47A1;
}

.categoryB
{
    background:#E8F5E9;
    color:#1B5E20;
}

.categoryC
{
    background:#FFF8E1;
    color:#E65100;
}

.categoryD
{
    background:#F3E5F5;
    color:#4A148C;
}

.categoryA.active
{
    background:#90CAF9;
    color:#0D47A1;
    font-weight:bold;
}

.categoryB.active
{
    background:#A5D6A7;
    color:#1B5E20;
    font-weight:bold;
}

.categoryC.active
{
    background:#FFE082;
    color:#E65100;
    font-weight:bold;
}

.categoryD.active
{
    background:#CE93D8;
    color:#4A148C;
    font-weight:bold;
}      
#documentHeader
{
    background:#f2f2f2;
    border:1px solid #c0c0c0;
    padding:12px;
    margin-top:25px;
    margin-bottom:15px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
}
.pdfButton
{
    width:100%;
}
</style>

</head>

<body>

<h1>Sangrahaalaya 1.0</h1>

<div id="categoryHeader">
    Categories listed below
</div>
<div id="categoryHeader">
    Scroll to see documents in highlighted category
</div>
<div id="categoryButtons">

    <button
    id="btnCategoryA"
    class="category categoryA active">
    Vedam
</button>

<button
    id="btnCategoryB"
    class="category categoryB">
    Ashtottharam
</button>

<button
    id="btnCategoryC"
    class="category categoryC">
    Shlokam
</button>

<button
    id="btnCategoryD"
    class="category categoryD">
    Paaraayanam
</button>

</div>

<div id="documentHeader">
    Documents for the selected category
</div>
<div id="pdfButtonContainer">

</div>


</body>

</html>
